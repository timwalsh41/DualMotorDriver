; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = robtillaart/CRC@^1.0.3
monitor_speed = 115200
test_ignore = *   ; Skip tests when building/uploading to the nano target

[env:native]
platform = native

# build all files in the src/ folder by default
test_build_src = true

# exclude specific files from the build
build_src_filter = +<*> -<DualMotorDriver.ino> -<MotorDriver.cpp> -<MotorController.cpp>
lib_deps = robtillaart/CRC@^1.0.3   # required to access the library for building tests
build_flags = -DTEST -Itest/   # required for libraries to access the mock Arduino.h in test/